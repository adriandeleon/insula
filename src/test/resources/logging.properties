# Test-only logging.
#
# Several tests deliberately drive failure paths — a mirror serving corrupt bytes, a dead mirror,
# a checksum mismatch — and the production code correctly logs those at WARNING with a stack
# trace. Printing them on a green run makes the build output look like it failed, which trains
# people to ignore it. Real errors still surface: the assertions are what decide pass/fail.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO

com.insula.download.level = SEVERE
